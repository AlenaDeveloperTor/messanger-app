<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="contacts-block">
       <div class="search">Поиск ...</div>
       <div class="contact">
            <div class="avatar red"></div>
            <div class="info">
                   <p class="name">Анна(Босс)</p>
                   <p class="msg">Срочно сделает проект</p>
            </div>
            <div class="time">10:00</div>
       </div>

         <div class="contact">
            <div class="avatar yellow"></div>
            <div class="info">
                   <p class="name">Иван Иванов</p>
                   <p class="msg">Привет как дела?</p>
            </div>
            <div class="time">14:35</div>
       </div>

         <div class="contact">
            <div class="avatar green"></div>
            <div class="info">
                   <p class="name">Frontend чат</p>
                   <p class="msg">Кто знает как центрировать div?</p>
            </div>
            <div class="time">15:00</div>
       </div>
       



    </div>
    <div class="chat-block">
        <div class="selected-contact">
           <span class="contact-name">Иван Иванов</span>
           <span class="status">В сети</span>
        </div>
        <div class="chat">
           <div class="chat-msg">
              <p>Привет! Как дела?</p>
           </div>
           <div class="chat-msg me">
              <p>Привет! Как дела (Это я написал?)?</p>
           </div>
           <div class="chat-msg">
              <p>Привет! Как дела?</p>
           </div>
        </div>
        <div class="emoji">😃😀👿✅🔔😃🗨️🐶🐶💵🔹✔️🍒</div>
        <div class="message-input">
                     <div class="enter">Напишите сообщение</div>
                     <div class="btn">Отправить</div>
        </div>
         
    </div>
    
</body>
</html>
